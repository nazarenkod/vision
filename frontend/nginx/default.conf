# HSTS only on a request that came over https, through a proxy that says so (052): Vision works
# over http without a certificate too, and a browser keeps HSTS for a year once it sees it
map $http_x_forwarded_proto $vision_hsts {
  default "";
  ~^https "max-age=31536000";
}

server {
  listen 8080;
  # the headers a security scan looks for, as the API sends them (045); no version in errors
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # an empty value sends no header: over http there is none
  add_header Strict-Transport-Security $vision_hsts always;
  # Content-Security-Policy, with the address of the API, written by env.sh at start (052)
  include /tmp/vision-csp.conf;

  if ($request_uri ~ "\.\./"){
    return 403;
  }

  # No stored images here: the API serves them, only with a signature (043). The old
  # address answers 404 rather than the app's page.
  location /static/imageUploads/ {
    return 404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri$args $uri$args/ $uri $uri/ /index.html =404;
  }
}