group 'io.visual-regression-tracker.sdk-java'
version '4.3.1'

apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'jacoco'
apply plugin: "io.freefair.lombok"
apply plugin: "com.github.johnrengelman.shadow"

repositories {
    mavenCentral()
}

// the SDK runs on Java 11 and later, whatever JDK builds it
sourceCompatibility = 11
targetCompatibility = 11

buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }

    }
    dependencies {
        classpath "io.freefair.gradle:lombok-plugin:5.1.1"
        classpath "com.github.jengelman.gradle.plugins:shadow:5.2.0"
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'org.slf4j:slf4j-api:1.7.25'
    testImplementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.16'
    testImplementation group: 'org.testng', name: 'testng', version: '7.7.0'
    testImplementation 'commons-io:commons-io:2.18.0'
    testImplementation 'org.mockito:mockito-core:4.4.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.11.0'
    testImplementation 'uk.org.webcompere:system-stubs-testng:2.1.3'
}

test {
    useTestNG()
}

// codecov integration https://github.com/codecov/example-gradle
jacocoTestReport {
    reports {
        xml.enabled true
        html.enabled true
    }
}

check.dependsOn jacocoTestReport

// Vision: publish this build to a Maven repository so tests can use it.
//   gradle publishToMavenLocal                     -> ~/.m2, for one machine
//   gradle publish -PrepoUrl=https://nexus/... -PrepoUser=... -PrepoPassword=...
// Coordinates match upstream's JitPack artifact, so only the version changes in a pom.
publishing {
    publications {
        sdk(MavenPublication) {
            groupId = findProperty('publishGroup') ?: 'com.github.Visual-Regression-Tracker'
            artifactId = 'sdk-java'
            version = findProperty('publishVersion') ?: "${project.version}-vision.1"
            from components.java
        }
    }
    repositories {
        if (findProperty('repoUrl')) {
            maven {
                name = 'company'
                url = findProperty('repoUrl')
                if (findProperty('repoUser')) {
                    credentials {
                        username = findProperty('repoUser')
                        password = findProperty('repoPassword')
                    }
                }
            }
        }
    }
}
